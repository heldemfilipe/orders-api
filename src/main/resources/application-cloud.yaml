# perfil da nuvem: so o CRUD. Kafka, consumers, DLT e frete (circuit breaker) ficam no perfil padrao.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
  mongodb:
    # sem valor padrao de proposito: se o segredo nao chegar, a aplicacao nao sobe
    uri: ${MONGODB_URI}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # prometheus: raspado pelo ServiceMonitor no Kubernetes (eks-gitops-config)
        include: health,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness e /readiness para as probes do Kubernetes
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

services:
  mongo:
    image: mongo:8
    container_name: pedidos-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pedidos}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-pedidos}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  kafka:
    image: apache/kafka:4.2.1
    container_name: pedidos-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 20s
      
  api:
    build: .
    container_name: pedidos-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: mongo
      MONGO_USER: ${MONGO_USER:-pedidos}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-pedidos}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FRETE_URL: http://frete:8080
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      frete:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: pedidos-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
  frete:
    image: wiremock/wiremock:3.13.2
    container_name: pedidos-frete
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock

volumes:
  mongo-data:
  kafka-data:

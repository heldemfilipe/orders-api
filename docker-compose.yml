services:
  mongo:
    image: mongo:8
    container_name: pedidos-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pedidos}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-pedidos}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: pedidos-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGO_HOST: mongo
      MONGO_USER: ${MONGO_USER:-pedidos}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-pedidos}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongo-data:
